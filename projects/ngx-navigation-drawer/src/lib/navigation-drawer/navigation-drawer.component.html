<div class="navigation-drawer" [ngClass]="{ 'main-folded': mainFolded, 'sub-folded': subFolded }" role="navigation" aria-label="Main Navigation">

  <!-- folding control -->
  <div class="navigation-folding-control">
    <mat-icon *ngIf="enableMainFolding" (click)="toggleFoldingMain()">menu</mat-icon>
    <mat-icon *ngIf="enableSubFolding" (click)="toggleFoldingSub()">menu</mat-icon>
  </div>

  <!-- separator -->
  <div class="navigation-drawer-separator right-border"></div>

  <!-- projection -->
  <div class="navigation-drawer-projection right-border">
    <ng-content class="projected-content"></ng-content>
  </div>

  <!-- separator -->
  <div class="navigation-drawer-separator right-border"></div>

  <!-- items -->
  <div class="navigation-drawer-items" autofocus>
    <!-- main -->
    <div class="navigation-drawer-main-items right-border" [ngClass]="{ 'main-folded': mainFolded }">
      <ngx-navigation-drawer-item
        *ngFor="let item of mainNavigationDrawerItems; let i = index"
        [icon]="item.icon"
        [description]="item.description"
        [matTooltip]="mainFolded ? item.description : ''"
        [matTooltipPosition]="'right'"
        [folded]="mainFolded"
        [selected]="isMainSelected(item.id)"
        (click)="mainNavigation(item.id, item.action)"
        (focusin)="onMainFocus(item.id)"
        (focusout)="onMainBlur()"
        tabindex={{i+1}}>
      </ngx-navigation-drawer-item>
    </div>

    <!-- sub -->
    <div class="navigation-drawer-sub-items right-border" [ngClass]="{ 'sub-folded': subFolded }">
      <ngx-navigation-drawer-item
        *ngFor="let item of getSubItemsForMainId(currentMainId); let j = index"
        [icon]="item.icon"
        [description]="item.description"
        [matTooltip]="subFolded ? item.description : ''"
        [matTooltipPosition]="'right'"
        [folded]="subFolded"
        [selected]="isSubSelected(item.id)"
        (click)="subNavigation(item.id, item.action)"
        (focusin)="onSubFocus(item.id)"
        (focusout)="onSubBlur()"
        tabindex={{currentMainId}}>
      </ngx-navigation-drawer-item>
    </div>
  </div>
</div>
